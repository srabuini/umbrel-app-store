version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: wasabit-tunnel-watchdog_web_1
      APP_PORT: 8080

  # Status page (the one you open from the Umbrel dashboard)
  web:
    image: busybox:1.36
    restart: on-failure
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    volumes:
      - ${APP_DATA_DIR}/data/www:/www:ro

  # The watchdog itself
  watchdog:
    image: docker:27-cli
    restart: unless-stopped
    # Host network: it needs to reach the connector's internal IP (10.21.0.x)
    # and check internet/DNS using the Umbrel's real network configuration.
    network_mode: host
    entrypoint: ["/bin/sh", "/app/watchdog.sh"]
    environment:
      TARGET_CONTAINER: cloudflared_connector_1
      METRICS_PORT: "40901"
      CHECK_INTERVAL: "180"
      STARTUP_GRACE: "180"
      FAILS_BEFORE_RESTART: "2"
      DNS_PROBE: region1.v2.argotunnel.com
      TZ: ART3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/watchdog.sh:/app/watchdog.sh:ro
      - ${APP_DATA_DIR}/data:/data
